# uio-genirq.conf -- modprobe.d config for the generic-UIO byte-DMA path.
# Installed by two_jup/deploy_dtb.sh to /etc/modprobe.d/uio-genirq.conf.
#
# uio_pdrv_genirq only binds DT nodes whose `compatible` is in its of_id list.
# qpsk_byte_uio.dtso uses compatible = "generic-uio", so the module must be
# told to match it:
options uio_pdrv_genirq of_id=generic-uio
#
# deploy_dtb.sh ALSO writes /etc/modules-load.d/uio-genirq.conf containing the
# single line `uio_pdrv_genirq` so the module is loaded at boot (there is no
# other DT trigger for a `generic-uio` node until the module is present).
#
# ============================ CRITICAL (2026-07) ============================
# READ-ONLY board recon (Task B1 §4) found that on BOTH boards the RUNNING
# kernel `6.12.0-ga14dd7c6dea2` has NO module tree at all:
#     /lib/modules/6.12.0-ga14dd7c6dea2  -> does not exist
# so `modprobe uio_pdrv_genirq` CANNOT succeed today. The only uio_pdrv_genirq
# .ko files on the boards belong to unrelated Raspberry-Pi kernel trees
# (.146: rpi 6.1.54-v7*/v7l 32-bit ARM; .148: rpi 6.12.x-v8 arm64) -- WRONG
# arch/vermagic, do NOT graft them. The working axi-pmon UIO devices bind via
# the BUILT-IN CONFIG_UIO_XILINX_APM=y driver, not a module.
#
# => The upcoming kernel/image rebuild MUST make generic-UIO available for the
#    running kernel, PREFERABLY built-in (CONFIG_UIO_PDRV_GENIRQ=y), matching
#    how CONFIG_UIO_XILINX_APM=y already works. If it is kept =m instead, the
#    rebuild must ALSO install /lib/modules/6.12.0-ga14dd7c6dea2/ with the .ko
#    (+ depmod) or this modprobe.d/modules-load.d pair is inert.
#    uio_dmem_genirq is NOT a usable fallback -- it is equally =m and equally
#    absent from the (nonexistent) module tree.
# If built-in (=y), of_id is a KERNEL CMDLINE param instead:
#   uio_pdrv_genirq.of_id=generic-uio   (add to bootargs) -- this modprobe.d
#   options line is only honored when the driver is a loadable module.
# ===========================================================================
