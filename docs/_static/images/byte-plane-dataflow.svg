<svg xmlns="http://www.w3.org/2000/svg" class="adi-figure no-background"
     viewBox="0 0 1100 600" width="100%"
     style="max-width: 1080px; height: auto;">
  <style>
    svg.adi-figure {
      --adi-fill-info:   #d4e1ec;
      --adi-fill-drv:    #cbd9e8;
      --adi-fill-mcu:    #f4dca0;
      --adi-fill-hw:     #f7c8a4;
      --adi-fill-app:    #e0d0e8;
      --adi-fill-blank:  #ffffff;
      --adi-box-stroke:  #c9bfa9;
      --adi-panel-bg:    #f7f1e6;
      --adi-panel-stroke:#e3dcc9;
      --adi-datax-bg:    #e4ecf6;
      --adi-datax-stroke:#b6c4dc;
      --adi-text-strong: #2b2a26;
      --adi-text-muted:  #6b6660;
      --adi-arrow:       #b3aa97;
      --adi-accent:      #6b8aaa;
    }
    @media (prefers-color-scheme: dark) {
      svg.adi-figure {
        --adi-fill-info: #2a3a52; --adi-fill-drv: #243246;
        --adi-fill-mcu: #4d402a;  --adi-fill-hw: #4d3525;
        --adi-fill-app: #3d2e48;  --adi-fill-blank: #14181e;
        --adi-box-stroke: #4a5260;
        --adi-panel-bg: #1a2028;  --adi-panel-stroke: #3a424b;
        --adi-datax-bg: #1f2a3d;  --adi-datax-stroke: #3a4960;
        --adi-text-strong: #e5e5e5; --adi-text-muted: #aaaaaa;
        --adi-arrow: #6a7484;      --adi-accent: #7da3c4;
      }
    }
    body.dark svg.adi-figure {
      --adi-fill-info: #2a3a52; --adi-fill-drv: #243246;
      --adi-fill-mcu: #4d402a;  --adi-fill-hw: #4d3525;
      --adi-fill-app: #3d2e48;  --adi-fill-blank: #14181e;
      --adi-box-stroke: #4a5260;
      --adi-panel-bg: #1a2028;  --adi-panel-stroke: #3a424b;
      --adi-datax-bg: #1f2a3d;  --adi-datax-stroke: #3a4960;
      --adi-text-strong: #e5e5e5; --adi-text-muted: #aaaaaa;
      --adi-arrow: #6a7484;      --adi-accent: #7da3c4;
    }
    svg.adi-figure .adi-panel { fill: var(--adi-panel-bg); stroke: var(--adi-panel-stroke); stroke-width: 1.25; }
    svg.adi-figure .adi-datax-band { fill: var(--adi-datax-bg); stroke: var(--adi-datax-stroke); stroke-width: 1.25; }
    svg.adi-figure .adi-title { font: 600 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-strong); }
    svg.adi-figure .adi-subtitle { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); }
    svg.adi-figure .adi-section-label { font: 600 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); letter-spacing: 0.04em; }
    svg.adi-figure .box { stroke: var(--adi-box-stroke); stroke-width: 1.25; }
    svg.adi-figure .box-text { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-strong); }
    svg.adi-figure .box-desc { font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); }
    svg.adi-figure .arrow { stroke: var(--adi-arrow); stroke-width: 1.5; fill: none; }
    svg.adi-figure .arrow-dash { stroke: var(--adi-arrow); stroke-width: 1.25; fill: none; stroke-dasharray: 4 3; }
    svg.adi-figure .arrowhead-fill { fill: var(--adi-arrow); }
    svg.adi-figure .note-text { font: italic 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); }
    svg.adi-figure .accent-text { fill: var(--adi-accent); }
  </style>

  <defs>
    <marker id="bp-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrowhead-fill"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1080" height="580" rx="14" class="adi-panel"/>

  <text x="550" y="38" class="adi-title" text-anchor="middle">RX byte plane on board 148 — dataflow and register taps</text>
  <text x="550" y="58" class="adi-subtitle" text-anchor="middle">MATLAB-generated netlist &#8594; platform byte FIFO &#8594; rx_byte_dma &#8594; DDR carve &#8594; host</text>

  <!-- ============== Dataflow row ============== -->
  <text x="50" y="92" class="adi-section-label">DATAFLOW (one frame = 191 &#215; 64-bit words = 1528 B)</text>

  <rect x="40" y="102" width="195" height="86" rx="8" class="box" fill="var(--adi-fill-mcu)"/>
  <text x="137" y="127" class="box-text" text-anchor="middle">RX demod chain</text>
  <text x="137" y="145" class="box-desc" text-anchor="middle">HDL Coder netlist</text>
  <text x="137" y="161" class="box-desc" text-anchor="middle">samples never stall —</text>
  <text x="137" y="175" class="box-desc" text-anchor="middle">the chain free-runs</text>

  <line x1="235" y1="145" x2="262" y2="145" class="arrow" marker-end="url(#bp-arrow)"/>

  <rect x="264" y="102" width="195" height="86" rx="8" class="box" fill="var(--adi-fill-mcu)"/>
  <text x="361" y="127" class="box-text" text-anchor="middle">ByteSerializer</text>
  <text x="361" y="145" class="box-desc" text-anchor="middle">netlist output: packs the</text>
  <text x="361" y="161" class="box-desc" text-anchor="middle">decoded bits into 191</text>
  <text x="361" y="175" class="box-desc" text-anchor="middle">64-bit words per frame</text>

  <line x1="459" y1="145" x2="486" y2="145" class="arrow" marker-end="url(#bp-arrow)"/>

  <rect x="488" y="102" width="195" height="86" rx="8" class="box" fill="var(--adi-fill-info)"/>
  <text x="585" y="127" class="box-text" text-anchor="middle">Byte FIFO (platform)</text>
  <text x="585" y="145" class="box-desc" text-anchor="middle">1536 words = 8.04 frames</text>
  <text x="585" y="161" class="box-desc" text-anchor="middle">outside the netlist; skid-</text>
  <text x="585" y="175" class="box-desc" text-anchor="middle">buffer fix site (TICK_FIX_SIM)</text>

  <line x1="683" y1="145" x2="710" y2="145" class="arrow" marker-end="url(#bp-arrow)"/>

  <rect x="712" y="102" width="195" height="86" rx="8" class="box" fill="var(--adi-fill-drv)"/>
  <text x="809" y="127" class="box-text" text-anchor="middle">rx_byte_dma</text>
  <text x="809" y="145" class="box-desc" text-anchor="middle">ADI axi_dmac @ 0x9D200000</text>
  <text x="809" y="161" class="box-desc" text-anchor="middle">S2MM; instantiated by</text>
  <text x="809" y="175" class="box-desc" text-anchor="middle">matlab_processors.tcl</text>

  <line x1="907" y1="145" x2="934" y2="145" class="arrow" marker-end="url(#bp-arrow)"/>

  <rect x="936" y="102" width="124" height="86" rx="8" class="box" fill="var(--adi-fill-app)"/>
  <text x="998" y="127" class="box-text" text-anchor="middle">DDR carve</text>
  <text x="998" y="145" class="box-desc" text-anchor="middle">reserved region;</text>
  <text x="998" y="161" class="box-desc" text-anchor="middle">qpsk_tun mmaps</text>
  <text x="998" y="175" class="box-desc" text-anchor="middle">and drains it</text>

  <!-- ============== CP1 tap callout ============== -->
  <line x1="361" y1="188" x2="361" y2="222" class="arrow-dash" marker-end="url(#bp-arrow)"/>
  <rect x="230" y="224" width="262" height="52" rx="8" class="box" fill="var(--adi-fill-hw)"/>
  <text x="361" y="245" class="box-text" text-anchor="middle">CP1 checksum tap (framestat)</text>
  <text x="361" y="263" class="box-desc" text-anchor="middle">16-bit byte-sum of delivered words, per frame</text>

  <line x1="585" y1="188" x2="585" y2="222" class="arrow-dash" marker-end="url(#bp-arrow)"/>
  <rect x="520" y="224" width="262" height="52" rx="8" class="box" fill="var(--adi-fill-hw)"/>
  <text x="651" y="245" class="box-text" text-anchor="middle">Stall / TXUR witnesses (fsv2+)</text>
  <text x="651" y="263" class="box-desc" text-anchor="middle">0x1C4 byte_rx stall cycles &#183; 0x1C8 TX underruns</text>

  <!-- ============== Register band ============== -->
  <text x="50" y="312" class="adi-section-label">MODEM REGISTER FILE (AXI4-Lite @ 0x9D000000, read via direct_reg_access)</text>
  <rect x="40" y="320" width="1020" height="220" rx="10" class="adi-datax-band"/>

  <rect x="60" y="336" width="320" height="88" rx="8" class="box" fill="var(--adi-fill-blank)"/>
  <text x="220" y="356" class="box-text" text-anchor="middle">Counters (reset-aware!)</text>
  <text x="220" y="374" class="box-desc" text-anchor="middle">0x104 packets_out — reset by rstCS + watchdog 0x000</text>
  <text x="220" y="390" class="box-desc" text-anchor="middle">0x108 biterr (BIST) &#183; 0x150 rstcs_count</text>
  <text x="220" y="406" class="box-desc" text-anchor="middle">0x154 cfc_est &#183; 0x15C adc_forensic (debug builds)</text>

  <rect x="396" y="336" width="320" height="88" rx="8" class="box" fill="var(--adi-fill-blank)"/>
  <text x="556" y="356" class="box-text" text-anchor="middle">Control / selects (write-only readback)</text>
  <text x="556" y="374" class="box-desc" text-anchor="middle">0x000 soft reset (watchdog) &#183; 0x110 rstCS pulse</text>
  <text x="556" y="390" class="box-desc" text-anchor="middle">0x114 rx_input_select (1 = air, 0 = internal loopback)</text>
  <text x="556" y="406" class="box-desc" text-anchor="middle">0x118 tx_source_select &#183; 0x158 tx_data_source (K5)</text>

  <rect x="732" y="336" width="308" height="88" rx="8" class="box" fill="var(--adi-fill-blank)"/>
  <text x="886" y="356" class="box-text" text-anchor="middle">FrameStat block (instrument images)</text>
  <text x="886" y="374" class="box-desc" text-anchor="middle">0x1C0 wordcnt (free-run) &#183; 0x1C4 stall &#183; 0x1C8 txur</text>
  <text x="886" y="390" class="box-desc" text-anchor="middle">0x1D0/0x1D4 head lo/hi (non-popping) &#183; 0x1D8 stat</text>
  <text x="886" y="406" class="box-desc" text-anchor="middle">0x1DC pop — write a CHANGED token to advance</text>

  <rect x="60" y="440" width="980" height="84" rx="8" class="box" fill="var(--adi-fill-info)"/>
  <text x="550" y="461" class="box-text" text-anchor="middle">FrameStat record (64-bit, one per RX frame, 64-deep FIFO)</text>
  <text x="550" y="481" class="box-desc" text-anchor="middle">[63:48] payload_checksum (16-bit byte-sum of delivered words) &#183; [47:32] cfc snapshot &#183; [31:24] agc_level (0 in LEAN) &#183; [23:16] corr_strength</text>
  <text x="550" y="497" class="box-desc" text-anchor="middle">[11] sync_low_margin &#183; [10] txur_in_frame &#183; [9] stall_in_frame &#183; [8] cs_reset_in_frame &#183; [7:0] frame_seq = packets_out &amp; 0xFF (host frame-align tag)</text>
  <text x="550" y="513" class="note-text" text-anchor="middle">Full spec: docs/evidence/FRAMESTAT_NOTES.md — the layout here is a summary, not the contract</text>

  <text x="550" y="565" class="note-text" text-anchor="middle">DRA (direct_reg_access) is a SINGLE address latch — two concurrent readers corrupt each other. Stop the lock watchdog before any manual register session.</text>
</svg>
