<svg xmlns="http://www.w3.org/2000/svg" class="adi-figure no-background"
     viewBox="0 0 1100 620" width="100%"
     style="max-width: 1080px; height: auto;">
  <style>
    svg.adi-figure {
      --adi-fill-info:   #d4e1ec;
      --adi-fill-drv:    #cbd9e8;
      --adi-fill-mcu:    #f4dca0;
      --adi-fill-hw:     #f7c8a4;
      --adi-fill-app:    #e0d0e8;
      --adi-fill-blank:  #ffffff;
      --adi-box-stroke:  #c9bfa9;
      --adi-panel-bg:    #f7f1e6;
      --adi-panel-stroke:#e3dcc9;
      --adi-datax-bg:    #e4ecf6;
      --adi-datax-stroke:#b6c4dc;
      --adi-text-strong: #2b2a26;
      --adi-text-muted:  #6b6660;
      --adi-arrow:       #b3aa97;
      --adi-accent:      #6b8aaa;
    }
    @media (prefers-color-scheme: dark) {
      svg.adi-figure {
        --adi-fill-info: #2a3a52; --adi-fill-drv: #243246;
        --adi-fill-mcu: #4d402a;  --adi-fill-hw: #4d3525;
        --adi-fill-app: #3d2e48;  --adi-fill-blank: #14181e;
        --adi-box-stroke: #4a5260;
        --adi-panel-bg: #1a2028;  --adi-panel-stroke: #3a424b;
        --adi-datax-bg: #1f2a3d;  --adi-datax-stroke: #3a4960;
        --adi-text-strong: #e5e5e5; --adi-text-muted: #aaaaaa;
        --adi-arrow: #6a7484;      --adi-accent: #7da3c4;
      }
    }
    body.dark svg.adi-figure {
      --adi-fill-info: #2a3a52; --adi-fill-drv: #243246;
      --adi-fill-mcu: #4d402a;  --adi-fill-hw: #4d3525;
      --adi-fill-app: #3d2e48;  --adi-fill-blank: #14181e;
      --adi-box-stroke: #4a5260;
      --adi-panel-bg: #1a2028;  --adi-panel-stroke: #3a424b;
      --adi-datax-bg: #1f2a3d;  --adi-datax-stroke: #3a4960;
      --adi-text-strong: #e5e5e5; --adi-text-muted: #aaaaaa;
      --adi-arrow: #6a7484;      --adi-accent: #7da3c4;
    }
    svg.adi-figure .adi-panel { fill: var(--adi-panel-bg); stroke: var(--adi-panel-stroke); stroke-width: 1.25; }
    svg.adi-figure .adi-datax-band { fill: var(--adi-datax-bg); stroke: var(--adi-datax-stroke); stroke-width: 1.25; }
    svg.adi-figure .adi-title { font: 600 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-strong); }
    svg.adi-figure .adi-subtitle { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); }
    svg.adi-figure .adi-section-label { font: 600 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); letter-spacing: 0.04em; }
    svg.adi-figure .box { stroke: var(--adi-box-stroke); stroke-width: 1.25; }
    svg.adi-figure .box-text { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-strong); }
    svg.adi-figure .box-desc { font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); }
    svg.adi-figure .arrow { stroke: var(--adi-arrow); stroke-width: 1.5; fill: none; }
    svg.adi-figure .arrow-dash { stroke: var(--adi-arrow); stroke-width: 1.25; fill: none; stroke-dasharray: 4 3; }
    svg.adi-figure .arrowhead-fill { fill: var(--adi-arrow); }
    svg.adi-figure .note-text { font: italic 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); }
    svg.adi-figure .accent-text { fill: var(--adi-accent); }
  </style>

  <defs>
    <marker id="ha-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrowhead-fill"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1080" height="600" rx="14" class="adi-panel"/>

  <text x="550" y="38" class="adi-title" text-anchor="middle">qpsk_tun — one thread, two duty cycles, six instruments</text>
  <text x="550" y="58" class="adi-subtitle" text-anchor="middle">The single event loop serves both TX feed and RX drain — the coupling that caused the wedge</text>

  <!-- TUN at top -->
  <rect x="410" y="76" width="280" height="50" rx="8" class="box" fill="var(--adi-fill-app)"/>
  <text x="550" y="97" class="box-text" text-anchor="middle">TUN interface (Linux)</text>
  <text x="550" y="115" class="box-desc" text-anchor="middle">IP packets in / delivered frames out</text>

  <line x1="470" y1="126" x2="290" y2="168" class="arrow" marker-end="url(#ha-arrow)"/>
  <line x1="810" y1="168" x2="630" y2="126" class="arrow" marker-end="url(#ha-arrow)"/>

  <!-- ============== TX column ============== -->
  <text x="60" y="162" class="adi-section-label">TX SUBMIT PATH</text>
  <rect x="50" y="170" width="440" height="74" rx="8" class="box" fill="var(--adi-fill-info)"/>
  <text x="270" y="192" class="box-text" text-anchor="middle">Frame + CRC-32 + seq tag</text>
  <text x="270" y="210" class="box-desc" text-anchor="middle">1528 B payload into a 3080 B TX transfer (zero-pad slack)</text>
  <text x="270" y="226" class="box-desc" text-anchor="middle">written into the TX slot ring in the DDR carve</text>

  <line x1="270" y1="244" x2="270" y2="272" class="arrow" marker-end="url(#ha-arrow)"/>

  <rect x="50" y="274" width="440" height="74" rx="8" class="box" fill="var(--adi-fill-drv)"/>
  <text x="270" y="296" class="box-text" text-anchor="middle">Submit to tx_byte_dma</text>
  <text x="270" y="314" class="box-desc" text-anchor="middle">max_inflight = 2 transfers &#8776; only ~1.6 ms of air buffered</text>
  <text x="270" y="330" class="box-desc" text-anchor="middle">the feeder must be revisited every &#8804; 1.6 ms or TX starves</text>

  <!-- ============== RX column ============== -->
  <text x="620" y="162" class="adi-section-label">RX DRAIN PATH</text>
  <rect x="610" y="170" width="440" height="74" rx="8" class="box" fill="var(--adi-fill-info)"/>
  <text x="830" y="192" class="box-text" text-anchor="middle">Completed DMA area (EOT IRQ or poll)</text>
  <text x="830" y="210" class="box-desc" text-anchor="middle">one area = rx_multi (32) slices; queued mode re-arms per area</text>
  <text x="830" y="226" class="box-desc" text-anchor="middle">cyclic mode (QPSK_RX_CYCLIC): no boundaries, ring reader</text>

  <line x1="830" y1="244" x2="830" y2="272" class="arrow" marker-end="url(#ha-arrow)"/>

  <rect x="610" y="274" width="440" height="74" rx="8" class="box" fill="var(--adi-fill-drv)"/>
  <text x="830" y="296" class="box-text" text-anchor="middle">rx_pump_queued() slice scoring</text>
  <text x="830" y="314" class="box-desc" text-anchor="middle">CRC verdict per slice; junk slices cost ~2.6 ms EACH to score</text>
  <text x="830" y="330" class="box-desc" text-anchor="middle">QPSK_RX_DRAIN_BUDGET=4 caps slices per pump call (wedge fix)</text>

  <!-- starvation coupling -->
  <line x1="610" y1="330" x2="494" y2="330" class="arrow-dash" marker-end="url(#ha-arrow)"/>
  <text x="552" y="320" class="note-text" text-anchor="middle">unbounded drain</text>
  <text x="552" y="344" class="note-text" text-anchor="middle">starves the feeder</text>

  <!-- ============== Instruments band ============== -->
  <text x="60" y="388" class="adi-section-label">ENV-GATED INSTRUMENTS (unset = zero cost, byte-identical output)</text>
  <rect x="50" y="396" width="1000" height="164" rx="10" class="adi-datax-band"/>

  <rect x="70" y="412" width="310" height="62" rx="8" class="box" fill="var(--adi-fill-blank)"/>
  <text x="225" y="432" class="box-text" text-anchor="middle">QPSK_TXLOG</text>
  <text x="225" y="448" class="box-desc" text-anchor="middle">TX submit ring: timestamps, inflight, spins —</text>
  <text x="225" y="462" class="box-desc" text-anchor="middle">the instrument that caught the feeder gaps</text>

  <rect x="396" y="412" width="310" height="62" rx="8" class="box" fill="var(--adi-fill-blank)"/>
  <text x="551" y="432" class="box-text" text-anchor="middle">QPSK_CKPT / QPSK_CKPT_N</text>
  <text x="551" y="448" class="box-desc" text-anchor="middle">CP2/CP3 fold checkpoints across the DMA-buffer</text>
  <text x="551" y="462" class="box-desc" text-anchor="middle">&#8594; host-copy seam (exonerated the RX seam)</text>

  <rect x="722" y="412" width="310" height="62" rx="8" class="box" fill="var(--adi-fill-blank)"/>
  <text x="877" y="432" class="box-text" text-anchor="middle">QPSK_FSLOG</text>
  <text x="877" y="448" class="box-desc" text-anchor="middle">CP1 comparator: fabric framestat checksum vs</text>
  <text x="877" y="462" class="box-desc" text-anchor="middle">host checksum; pop = CHANGED token &#8594; 0x1DC</text>

  <rect x="70" y="486" width="310" height="62" rx="8" class="box" fill="var(--adi-fill-blank)"/>
  <text x="225" y="506" class="box-text" text-anchor="middle">QPSK_RX_DRAIN_BUDGET</text>
  <text x="225" y="522" class="box-desc" text-anchor="middle">cap slices drained per pump call (0 = legacy</text>
  <text x="225" y="536" class="box-desc" text-anchor="middle">unbounded); N=4 ends the wedge in loopback</text>

  <rect x="396" y="486" width="310" height="62" rx="8" class="box" fill="var(--adi-fill-blank)"/>
  <text x="551" y="506" class="box-text" text-anchor="middle">QPSK_RX_CYCLIC</text>
  <text x="551" y="522" class="box-desc" text-anchor="middle">write-pointer ring reader (0x1C0 freshness);</text>
  <text x="551" y="536" class="box-desc" text-anchor="middle">needs a CONFIG.CYCLIC=1 bitstream + -M K</text>

  <rect x="722" y="486" width="310" height="62" rx="8" class="box" fill="var(--adi-fill-blank)"/>
  <text x="877" y="506" class="box-text" text-anchor="middle">QPSK_FRAMELOG</text>
  <text x="877" y="522" class="box-desc" text-anchor="middle">48-byte record per scored slice (regs 0x104/0x108/</text>
  <text x="877" y="536" class="box-desc" text-anchor="middle">0x150/0x154/0x15C) — feeds every loss ledger</text>

  <text x="550" y="588" class="note-text" text-anchor="middle">Every instrument is sampled or ring-buffered so the measurement does not perturb the loop it is measuring (verified by instrument A/B before trusting its data).</text>
</svg>
